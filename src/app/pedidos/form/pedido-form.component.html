<div class="modal-fundo modal-backdrop-custom">
  <section
    class="modal-produto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-modal"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-content border-0 shadow-lg rounded-4 p-4">
      <header class="modal-cabecalho modal-header border-0 p-0 pb-3">
        <div>
          <small>{{ editando() ? 'EDITAR CADASTRO' : 'NOVO CADASTRO' }}</small>
          <h2 id="titulo-modal">{{ editando() ? 'Editar produto' : 'Adicionar produto' }}</h2>
        </div>
        <button class="fechar" type="button" aria-label="Fechar" (click)="fechar.emit()">
          &times;
        </button>
      </header>

      <form class="modal-body p-0" #produtoForm="ngForm" (ngSubmit)="salvar(produtoForm)">
        <div class="campo campo-largo">
          <label class="form-label" for="nome">Nome do produto</label>
          <input
            class="form-control"
            id="nome"
            name="nome"
            type="text"
            placeholder="Exemplo: Suporte para headset"
            [(ngModel)]="produto.nome"
            required
          />
        </div>

        <div class="linha-campos">
          <div class="campo">
            <label class="form-label" for="categoria">Categoria</label>
            <select
              class="form-select"
              id="categoria"
              name="categoria"
              [(ngModel)]="produto.categoria"
              required
            >
              <option value="">Selecione</option>
              <option value="Peca tecnica">Peça técnica</option>
              <option value="Decoracao">Decoração</option>
              <option value="Miniatura">Miniatura</option>
              <option value="Prototipo">Protótipo</option>
              <option value="Reposicao">Reposição</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <div class="campo">
            <label class="form-label" for="material">Material</label>
            <select
              class="form-select"
              id="material"
              name="material"
              [(ngModel)]="produto.material"
              [disabled]="carregandoMateriais()"
              required
            >
              <option value="">
                {{ carregandoMateriais() ? 'Carregando materiais...' : 'Selecione um material' }}
              </option>
              @for (material of materiais(); track material.id) {
                <option [value]="material.nome">
                  {{ material.nome }} - {{ material.tipo }} - {{ material.cor }}
                </option>
              }
            </select>
          </div>
        </div>

        <div class="linha-campos">
          <div class="campo">
            <label class="form-label" for="cor">Cor</label>
            <input
              class="form-control"
              id="cor"
              name="cor"
              type="text"
              placeholder="Exemplo: Preto fosco"
              [(ngModel)]="produto.cor"
              required
            />
          </div>

          <div class="campo">
            <label class="form-label" for="quantidade">Quantidade</label>
            <input
              class="form-control"
              id="quantidade"
              name="quantidade"
              type="number"
              min="1"
              [(ngModel)]="produto.quantidade"
              required
            />
          </div>
        </div>

        <div class="linha-campos">
          <div class="campo">
            <label class="form-label" for="valorUnitario">Valor unitário (R$)</label>
            <input
              class="form-control"
              id="valorUnitario"
              name="valorUnitario"
              type="number"
              min="0.01"
              step="0.01"
              [(ngModel)]="produto.valorUnitario"
              required
            />
          </div>
          <div class="campo">
            <label class="form-label" for="prazoProducao">Prazo de produção (dias)</label>
            <input
              class="form-control"
              id="prazoProducao"
              name="prazoProducao"
              type="number"
              min="1"
              [(ngModel)]="produto.prazoProducao"
              required
            />
          </div>
        </div>

        <div class="campo campo-largo">
          <label class="form-label" for="descricao">Descrição</label>
          <textarea
            class="form-control"
            id="descricao"
            name="descricao"
            rows="4"
            placeholder="Detalhes do produto, medidas, acabamento ou observações"
            [(ngModel)]="produto.descricao"
          ></textarea>
        </div>

        <footer class="modal-acoes modal-footer border-0 px-0 pb-0">
          <button type="button" class="cancelar btn btn-outline-secondary" (click)="fechar.emit()">
            Cancelar
          </button>
          <button type="submit" class="salvar btn btn-primary" [disabled]="salvando()">
            {{ salvando() ? 'Salvando...' : editando() ? 'Atualizar produto' : 'Salvar produto' }}
          </button>
        </footer>

        @if (mensagem()) {
          <div
            class="alert mb-0 mt-3"
            [class.alert-success]="sucesso()"
            [class.alert-danger]="!sucesso()"
            role="status"
          >
            {{ mensagem() }}
          </div>
        }
      </form>
    </div>
  </section>
</div>
