services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true

  frontend-prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    profiles:
      - production

volumes:
  frontend_node_modules:

