services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "4100:4200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped

  frontend-prod:
    build:
      context: .
      target: production
    ports:
      - "4300:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - production
    restart: unless-stopped

volumes:
  frontend_node_modules:

